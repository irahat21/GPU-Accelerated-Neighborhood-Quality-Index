<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>NYC Neighborhood Quality Index</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&family=DM+Sans:wght@300;400;500&display=swap"
          rel="stylesheet"/>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="map"></div>

<div class="panel">
    <div class="panel-header">
        <div class="panel-title">NYC Quality Index</div>
        <div class="panel-sub">by zip code</div>
    </div>
    <div class="metric-list">
        <button class="metric-btn active" data-metric="overall" style="--accent-color: var(--overall)">
            <div class="metric-dot" style="background: var(--overall)"></div>
            <span class="metric-label">Overall Score</span>
            <span class="metric-key">ALL</span>
        </button>
        <button class="metric-btn" data-metric="air" style="--accent-color: var(--air)">
            <div class="metric-dot" style="background: var(--air)"></div>
            <span class="metric-label">Air Quality</span>
            <span class="metric-key">AQI</span>
        </button>
        <button class="metric-btn" data-metric="water" style="--accent-color: var(--water)">
            <div class="metric-dot" style="background: var(--water)"></div>
            <span class="metric-label">Drinking Water</span>
            <span class="metric-key">H₂O</span>
        </button>
        <button class="metric-btn" data-metric="edu" style="--accent-color: var(--edu)">
            <div class="metric-dot" style="background: var(--edu)"></div>
            <span class="metric-label">Education</span>
            <span class="metric-key">EDU</span>
        </button>
        <button class="metric-btn" data-metric="nypd" style="--accent-color: var(--nypd)">
            <div class="metric-dot" style="background: var(--nypd)"></div>
            <span class="metric-label">NYPD Complaints</span>
            <span class="metric-key">CPT</span>
        </button>
    </div>
</div>

<div class="tooltip-panel" id="tooltipPanel">
    <div class="tooltip-zip" id="ttZip">—</div>
    <div class="tooltip-borough" id="ttBorough">hover a zip code</div>
    <div class="score-card" style="border-left-color: var(--overall); margin-bottom: 8px;">
        <div class="score-name">Overall</div>
        <div class="score-value" id="ttOverall" style="color: var(--overall)">—</div>
        <div class="score-bar-wrap">
            <div class="score-bar-fill" id="barOverall" style="background: var(--overall); width: 0%"></div>
        </div>
    </div>
    <div class="score-grid">
        <div class="score-card" style="border-left-color: var(--air)">
            <div class="score-name">Air Quality</div>
            <div class="score-value" id="ttAir" style="color: var(--air)">—</div>
            <div class="score-bar-wrap">
                <div class="score-bar-fill" id="barAir" style="background: var(--air); width: 0%"></div>
            </div>
        </div>
        <div class="score-card" style="border-left-color: var(--water)">
            <div class="score-name">Drinking Water</div>
            <div class="score-value" id="ttWater" style="color: var(--water)">—</div>
            <div class="score-bar-wrap">
                <div class="score-bar-fill" id="barWater" style="background: var(--water); width: 0%"></div>
            </div>
        </div>
        <div class="score-card" style="border-left-color: var(--edu)">
            <div class="score-name">Education</div>
            <div class="score-value" id="ttEdu" style="color: var(--edu)">—</div>
            <div class="score-bar-wrap">
                <div class="score-bar-fill" id="barEdu" style="background: var(--edu); width: 0%"></div>
            </div>
        </div>
        <div class="score-card" style="border-left-color: var(--nypd)">
            <div class="score-name">NYPD Complaints</div>
            <div class="score-value" id="ttNypd" style="color: var(--nypd)">—</div>
            <div class="score-bar-wrap">
                <div class="score-bar-fill" id="barNypd" style="background: var(--nypd); width: 0%"></div>
            </div>
        </div>
    </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
</body>
</html>
